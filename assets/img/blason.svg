<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blason de Saint-Mathieu : parti, au premier d'azur à trois fasces d'argent, au second coupé, au I de cinq points d'azur équipolés à quatre d'argent, au II d'azur à la croix d'argent">
  <defs>
    <clipPath id="ecu">
      <path d="M32 2 58 9v24c0 13.8-10.6 24.4-26 29C16.6 57.4 6 46.8 6 33V9Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ecu)">
    <!-- fond argent par defaut -->
    <rect x="0" y="0" width="64" height="64" fill="#e4e5e7"/>

    <!-- 1 (dextre) : d'azur a trois fasces d'argent -->
    <rect x="0" y="0" width="32" height="64" fill="#6fb9e3"/>
    <rect x="0" y="10.43" width="32" height="8.43" fill="#e4e5e7"/>
    <rect x="0" y="27.29" width="32" height="8.43" fill="#e4e5e7"/>
    <rect x="0" y="44.14" width="32" height="8.43" fill="#e4e5e7"/>

    <!-- 2-I (senestre, chef) : cinq points d'azur equipoles a quatre d'argent -->
    <rect x="32" y="0" width="10.67" height="10" fill="#6fb9e3"/>
    <rect x="53.33" y="0" width="10.67" height="10" fill="#6fb9e3"/>
    <rect x="42.67" y="10" width="10.67" height="10" fill="#6fb9e3"/>
    <rect x="32" y="20" width="10.67" height="10" fill="#6fb9e3"/>
    <rect x="53.33" y="20" width="10.67" height="10" fill="#6fb9e3"/>

    <!-- 2-II (senestre, pointe) : d'azur a la croix d'argent -->
    <rect x="32" y="30" width="32" height="31" fill="#6fb9e3"/>
    <rect x="45" y="30" width="6" height="31" fill="#e4e5e7"/>
    <rect x="32" y="42.5" width="32" height="6" fill="#e4e5e7"/>
  </g>

  <path d="M32 2 58 9v24c0 13.8-10.6 24.4-26 29C16.6 57.4 6 46.8 6 33V9Z"
        fill="none" stroke="#2b5c78" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
